global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-local
    static_configs:
      - targets: ['node-exporter:9100']
        labels: { env: lab }

  # L'API TaskFlow, via nginx (port 80) qui proxy /metrics
  # Remplacer STAGING_IP et PROD_IP par les IP de taskflow-web1 et taskflow-web2
  - job_name: taskflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ['STAGING_IP:80']
        labels: { env: staging }
      - targets: ['PROD_IP:80']
        labels: { env: prod }

  # node_exporter déployé par Ansible sur les VMs
  - job_name: node-vms
    static_configs:
      - targets: ['STAGING_IP:9100']
        labels: { env: staging }
      - targets: ['PROD_IP:9100']
        labels: { env: prod }

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Boîte noire : Prometheus demande à blackbox de sonder chaque URL
  # Remplacer STAGING_IP et PROD_IP par les IP de taskflow-web1 et taskflow-web2
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://STAGING_IP/health
          - http://PROD_IP/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target # l'URL devient le paramètre ?target=
      - source_labels: [__param_target]
        target_label: instance # …et le label instance
      - target_label: __address__
        replacement: blackbox-exporter:9115 # c'est blackbox qu'on scrape réellement
      - source_labels: [__param_target]
        regex: 'http://STAGING_IP.*'
        target_label: env
        replacement: staging
      - source_labels: [__param_target]
        regex: 'http://PROD_IP.*'
        target_label: env
        replacement: prod
