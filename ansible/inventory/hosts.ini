# Inventaire du lab TaskFlow opérée
# Les VMs Multipass sont sur le "Default Switch" Hyper-V (NAT interne), invisible
# depuis WSL2/Docker Desktop (meme en mode mirrored). On passe donc par un
# port-forwarding Windows (netsh interface portproxy) vers l'IP reelle 192.168.1.34 :
#   192.168.1.34:2222 -> 172.20.232.71:22 (staging)
#   192.168.1.34:2223 -> 172.20.229.57:22 (prod)
#   192.168.1.34:8081 -> 172.20.232.71:80 (staging http)
#   192.168.1.34:8082 -> 172.20.229.57:80 (prod http)

[staging]
taskflow-web1 ansible_host=192.168.1.34 ansible_port=2222

[prod]
taskflow-web2 ansible_host=192.168.1.34 ansible_port=2223

# Groupe parent : les rôles ciblent "web", les playbooks limitent avec -l staging|prod
[web:children]
staging
prod

[web:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/taskflow_lab
